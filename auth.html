<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder | DevLab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">DevLab</a>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="aprender.html">Aprender</a>
                <a href="practicar.html">Practicar</a>
                <a href="herramientas.html">Herramientas</a>
                <a href="laboratorios.html">Laboratorios</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <div class="auth-card">
                <p class="eyebrow" id="auth-eyebrow">CUENTA</p>
                <h1 id="auth-title">Iniciar sesión</h1>
                <p id="auth-subtitle">Ingresá tus credenciales para sincronizar tu progreso en DevLab.</p>

                <form id="auth-form">
                    <div class="form-group" id="name-field-group" style="display: none;">
                        <label for="user-name">Nombre completo</label>
                        <input type="text" id="user-name" placeholder="Ej: Sebastián">
                    </div>

                    <div class="form-group">
                        <label for="user-email">Correo electrónico</label>
                        <input type="email" id="user-email" placeholder="nombre@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="user-password">Contraseña</label>
                        <input type="password" id="user-password" placeholder="Mínimo 6 caracteres" required>
                    </div>

                    <button type="submit" id="auth-submit-btn" class="hero-button" style="width: 100%; margin-top: 10px;">
                        Ingresar
                    </button>
                </form>

                <p id="auth-error-msg" class="wrong-feedback" style="margin-top: 15px;"></p>

                <div class="auth-toggle-box">
                    <span id="toggle-text">¿No tenés cuenta?</span>
                    <button type="button" id="toggle-auth-mode" class="text-link" style="background: none; border: none; cursor: pointer;">
                        Registrate acá
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="auth.js"></script>
    <script type="module" src="navbar.js"></script>
</body>

</html>
